# Production Docker Compose Configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - '127.0.0.1:27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - study-partner-network

  # Override all services for production
  api-gateway:
    restart: always
    environment:
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:-${FRONTEND_URL:-https://studypartner.app}}
    networks:
      - study-partner-network

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  auth-service:
    restart: always
    environment:
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:-${FRONTEND_URL:-https://studypartner.app}}
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/study_partner?authSource=admin
      - ALLOW_TEST_COUPONS=false
      - COUPON_CODES=
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://studypartner.app}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-noreply@studypartner.app}
      - EMAIL_FROM=${EMAIL_FROM:-StudyPartner <noreply@studypartner.app>}
      - APP_URL=${APP_URL:-https://studypartner.app}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - study-partner-network

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  user-profile-service:
    restart: always
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/study_partner?authSource=admin
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
      - CORS_ORIGIN=${CORS_ORIGIN:-${FRONTEND_URL:-https://studypartner.app}}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://studypartner.app}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - study-partner-network

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  study-service:
    restart: always
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/study_partner?authSource=admin
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
      - CORS_ORIGIN=${CORS_ORIGIN:-${FRONTEND_URL:-https://studypartner.app}}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - study_uploads:/app/services/study/uploads
    networks:
      - study-partner-network

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  ai-orchestrator-service:
    restart: always
    environment:
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:-${FRONTEND_URL:-https://studypartner.app}}
    networks:
      - study-partner-network

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  signal-processing-service:
    restart: always
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/study_partner?authSource=admin
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
      - CORS_ORIGIN=${CORS_ORIGIN:-${FRONTEND_URL:-https://studypartner.app}}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - study-partner-network

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  analytics-service:
    restart: always
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/study_partner?authSource=admin
      - CORS_ORIGIN=${CORS_ORIGIN:-${FRONTEND_URL:-https://studypartner.app}}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - study-partner-network

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  notification-service:
    restart: always
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET must be set}
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/study_partner?authSource=admin
      - CORS_ORIGIN=${CORS_ORIGIN:-${FRONTEND_URL:-https://studypartner.app}}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_PROFILE_SERVICE_URL=http://user-profile-service:3002
      - STUDY_SERVICE_URL=http://study-service:3003
      - EMAIL_NOTIFICATIONS_ENABLED=${EMAIL_NOTIFICATIONS_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-Study Partner <no-reply@study-partner.local>}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - study-partner-network

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  ai-service:
    restart: always
    environment:
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/study_partner?authSource=admin
      - APIFY_API_KEY=${APIFY_API_KEY:-}
      - HF_API_KEY=${HF_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      bash -c "uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --workers 2"
    networks:
      - study-partner-network

    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  frontend:
    restart: always
    networks:
      - study-partner-network

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

volumes:
  mongodb_data:
    driver: local
  study_uploads:
    driver: local

networks:
  study-partner-network:
    driver: bridge
